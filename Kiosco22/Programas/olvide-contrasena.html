<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="estilos/estilos2.css"> </head>
<body>
 <div class="contenedor">
    <div class="contenido">
        <div class="formulario">
            <h2>Recuperar Cuenta</h2>
            
            <div id="seccionEmail">
                <label>Ingresá tu Correo Electrónico</label>
                <input type="email" id="emailRecuperar" placeholder="ejemplo@correo.com">
                <button onclick="enviarRecuperacion()" class="btn">Enviar Código</button>
            </div>

            <div id="seccionCodigo" style="display: none;">
                <label>Ingresá el código de 5 dígitos enviado al servidor</label>
                <input type="text" id="inputCodigo" placeholder="Ej: 12345" maxlength="5">
                <button onclick="validarCodigo()" class="btn">Verificar Código</button>
            </div>

            <div id="seccionNuevaClave" style="display: none;">
                <label>Nueva Contraseña</label>
                <input type="password" id="nuevaContrasena" placeholder="Escribí tu nueva clave">
                <button onclick="guardarNuevaClave()" class="btn">Modificar Contraseña</button>
            </div>

            <p id="mensajeRecuperar" style="margin-top: 15px; color: #fff; font-weight: bold;"></p>
            
            <a href="/" style="display: block; margin-top: 15px;">Volver al Login</a>
        </div>
    </div>
</div>

<script src="JavaScr/login_front.js"></script>

</body>
</html>
